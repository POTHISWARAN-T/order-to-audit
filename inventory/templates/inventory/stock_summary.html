<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock summary</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    table { border-collapse: collapse; width: 100%; max-width: 600px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>
  <h2>Stock summary</h2>
  <table>
    <tr><th>Item</th><th>Type</th><th>Balance</th><th>Unit</th></tr>
    {% for row in rows %}
    <tr>
      <td>{{ row.item.name }}</td>
      <td>{{ row.item.get_item_type_display }}</td>
      <td>{{ row.balance }}</td>
      <td>{{ row.item.unit }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
