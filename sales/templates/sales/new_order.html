<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New order</title>
  <style>
    body { font-family: sans-serif; margin: 12px; max-width: 480px; }
    select, input, button { font-size: 18px; padding: 10px; width: 100%; box-sizing: border-box; margin: 6px 0; }
    .product { border: 1px solid #ccc; border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
    .price { color: #555; }
    .error { background: #fdd; padding: 8px; border-radius: 6px; }
    button { background: #1a7f37; color: white; border: 0; border-radius: 8px; }
    a { font-size: 18px; }
  </style>
</head>
<body>
  <h2>New order</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Customer</label>
    <select name="customer" required>
      <option value="">Select customer</option>
      {% for c in customers %}
      <option value="{{ c.pk }}" {% if c.pk|stringformat:"s" == selected_customer %}selected{% endif %}>{{ c.name }} ({{ c.state }})</option>
      {% endfor %}
    </select>
    {% for row in rows %}
    <div class="product">
      <b>{{ row.product.name }}</b>
      <div class="price">Rs {{ row.product.rate }} per {{ row.product.unit }}</div>
      <input type="number" name="qty_{{ row.product.pk }}" min="0" step="1" inputmode="numeric" placeholder="Quantity" value="{{ row.qty }}">
    </div>
    {% endfor %}
    <input type="text" name="notes" maxlength="200" placeholder="Note (optional)" value="{{ notes }}">
    <button type="submit">Submit order</button>
  </form>
  <p><a href="{% url 'my_orders' %}">My orders</a> &middot; <a href="/">Home</a></p>
</body>
</html>
