<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in</title>
  <style>
    body { font-family: sans-serif; margin: 16px; max-width: 400px; }
    input { font-size: 18px; padding: 6px; width: 100%; box-sizing: border-box; }
    button { font-size: 18px; padding: 8px 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Order-to-Audit login</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
</body>
</html>
